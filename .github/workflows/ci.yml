name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK/GStreamer bindings (app import check)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-gi gir1.2-gtk-3.0 \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Install test dependencies
        run: python3 -m pip install rapidfuzz
      - name: Compile check (all modules)
        run: |
          python3 - <<'EOF'
          import py_compile, pathlib
          for d in ("meeting_recorder", "transcriber", "tests"):
              for f in pathlib.Path(d).rglob("*.py"):
                  py_compile.compile(str(f), doraise=True)
          print("all modules compile")
          EOF
      - name: App imports (GTK + GStreamer + recorder pipeline elements)
        run: python3 -c "from meeting_recorder import app, recorder, storage, devices; print('imports OK; gst elements present:', recorder.gst_available())"
      - name: Transcriber unit tests
        run: |
          python3 tests/test_transcriber.py
          python3 tests/test_cloud.py

  fresh-install:
    name: Fresh install (${{ matrix.system }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Ubuntu 22.04
            image: ubuntu:22.04
            packages: apt-get update -q && apt-get install -y -q python3 python3-venv ffmpeg espeak-ng ca-certificates
          - system: Ubuntu 24.04
            image: ubuntu:24.04
            packages: apt-get update -q && apt-get install -y -q python3 python3-venv ffmpeg espeak-ng ca-certificates
          - system: Debian 13
            image: debian:13
            packages: apt-get update -q && apt-get install -y -q python3 python3-venv ffmpeg espeak-ng ca-certificates
          - system: Fedora
            image: fedora:latest
            packages: dnf install -y -q python3 ffmpeg-free espeak-ng
          - system: Arch
            image: archlinux:latest
            packages: pacman -Syu --noconfirm python ffmpeg espeak-ng
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install the system packages the app asks for
        run: ${{ matrix.packages }}
      - name: Set up transcription and transcribe a call
        run: python3 tests/test_fresh_install.py

  appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"  # no FUSE on CI runners
        run: packaging/build-appimage.sh
      - name: Sanity-check result
        run: |
          ls -la MeetingRecorder-x86_64.AppImage
          test "$(stat -c%s MeetingRecorder-x86_64.AppImage)" -gt 500000
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingRecorder-x86_64.AppImage
          path: MeetingRecorder-x86_64.AppImage
